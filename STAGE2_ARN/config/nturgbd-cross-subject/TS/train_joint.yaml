work_dir: ./work_dir/ntu/xsub/TS/MSAG3D_with_warm_up/train

# feeder
feeder: feeders2.feeder.Feeder
train_feeder_args:      
#  data_path: ../data/ntu/xsub/train_data_joint.npy
#  label_path: ../data/ntu/xsub/train_label.pkl
  data_path: ./data/xsub/train_data_joint.npy
  label_path: ./data/xsub/train_label.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

test_feeder_args:
  data_path: ./data/xsub/val_data_joint.npy #./data/ntu/xsub/val_data_joint.npy
  label_path: ./data/xsub/val_label.pkl #./data/ntu/xsub/val_label.pkl

# model
model: model.imputation_network.Model_student
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
#  num_gcn_scales: 13    # `num_scales` == `K + 1` in the paper
#  num_g3d_scales: 6
#  graph: graph.ntu_rgb_d.AdjMatrixGraph #(MSG3D)
  graph: graph.ntu_rgb_d.Graph
  #
  graph_args:
    labeling_mode: 'spatial'
  ATU_layer: 2
  in_channels: 15
  if_rotation: False
  seg_num: 1
  if_vibrate: False
  prediction_mask: 0
  GCNEncoder: "AGCN"
  T: 300
  predict_seg: 1
#
# optim
weight_decay: 0.0005
base_lr: 0.05
step: [30, 45]

# training
num_epoch: 65
device: [0]
batch_size: 40
forward_batch_size: 20
test_batch_size: 30
nesterov: True

warm_up_epoch: 5 #0
only_train_part: True #new
only_train_epoch: 5 #new



